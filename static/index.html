<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="author" content="Aman Srivastava"/>
<meta name="description" content="DUCKTAPE INDUSTRIAL — Zero-cloud local LAN file streaming created by Aman Srivastava."/>
<title>DUCKTAPE INDUSTRIAL — High-Speed Local LAN File Transfer</title>
<style>
  @layer base {
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
  }
  ::-webkit-scrollbar { display: none; }
  .industrial-grid {
    background-image: 
      linear-gradient(to right, rgba(244, 198, 14, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(244, 198, 14, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .glow-pulse {
    box-shadow: 0 0 0 0 rgba(244, 198, 14, 0.4);
    animation: pulse-yellow 2s infinite;
  }
  @keyframes pulse-yellow {
    0% { box-shadow: 0 0 0 0 rgba(244, 198, 14, 0.4); }
    70% { box-shadow: 0 0 0 30px rgba(244, 198, 14, 0); }
    100% { box-shadow: 0 0 0 0 rgba(244, 198, 14, 0); }
  }
</style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "background": "#0D0D0D",
          "surface": "#131313",
          "surface-container-low": "#1c1b1b",
          "surface-container-lowest": "#0e0e0e",
          "surface-container-high": "#2a2a2a",
          "primary-container": "#f4c60e",
          "on-surface": "#e5e2e1",
          "on-surface-variant": "#d1c6ac",
          "outline-variant": "#4e4632",
          "error": "#ffb4ab"
        },
        "fontFamily": {
          "headline-lg": ["Anton", "sans-serif"],
          "headline-md": ["Anton", "sans-serif"],
          "headline-sm": ["Anton", "sans-serif"],
          "mono-data": ["Space Mono", "monospace"],
          "label-caps": ["Space Mono", "monospace"]
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Anton:wght@400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-background font-mono-data text-on-surface antialiased selection:bg-primary-container selection:text-background">

<input type="file" id="browserFileInput" multiple style="display:none">

<!-- HEADER -->
<header class="fixed top-0 w-full z-50 bg-background/90 backdrop-blur border-b border-outline-variant/30">
  <div class="max-w-[1200px] mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="/ducktape_logo.png" alt="DUCKTAPE Logo" class="h-8 md:h-10 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('brandTextFallback').style.display='inline-block';" />
      <span id="brandTextFallback" class="font-headline-sm text-2xl md:text-3xl tracking-wider text-on-surface uppercase" style="display: none;">DUCKTAPE</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-primary-container animate-pulse" id="statusDot"></span>
      <span class="font-mono-data text-xs text-primary-container uppercase" id="headerStatusText">LOCAL_LAN_READY</span>
    </div>
  </div>
</header>

<main class="w-full min-h-screen pt-16">
  <div id="app"></div>
</main>

<footer class="w-full bg-surface-container-lowest border-t-4 border-primary-container pt-8 pb-4 mt-12">
  <div class="max-w-[1200px] mx-auto px-6 flex flex-col md:flex-row justify-between items-end gap-4">
    <div class="text-left">
      <div class="font-headline-sm text-on-surface uppercase">DUCKTAPE INDUSTRIAL</div>
      <div class="font-mono-data text-xs text-on-surface-variant uppercase">CREATED BY AMAN SRIVASTAVA // STRICT PROTOCOL ENFORCED // VERSION 3.1.0</div>
    </div>
    <div class="h-8 w-48 bg-[repeating-linear-gradient(45deg,#f4c60e,#f4c60e_10px,#131313_10px,#131313_20px)]"></div>
  </div>
</footer>

<script>
const params = new URLSearchParams(location.search);
const rawSid = params.get("sid") || (location.hash ? new URLSearchParams(location.hash.substring(1)).get("sid") : null);
const sid = rawSid ? rawSid.trim() : null;
const app = document.getElementById("app");
const statusDot = document.getElementById("statusDot");
const headerStatusText = document.getElementById("headerStatusText");
const browserFileInput = document.getElementById("browserFileInput");

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1024 ** 3) return (bytes / 1024 / 1024).toFixed(1) + " MB";
  return (bytes / 1024 ** 3).toFixed(2) + " GB";
}

sid ? renderReceiver() : renderSender();

// ============================== SENDER (LAPTOP) ==============================
function renderSender() {
  let selectedFiles = [];
  let wifiIp = null;
  let currentSid = null;

  app.innerHTML = `
    <section class="relative w-full min-h-[85vh] flex flex-col items-center justify-center industrial-grid overflow-hidden py-12">
      <div class="relative flex flex-col items-center gap-8">
        <div class="relative bg-on-surface text-background px-4 py-2 font-label-caps animate-bounce text-center text-xs font-bold">
          Click to select files from laptop disk
          <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-full w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-on-surface"></div>
        </div>

        <button id="uploadCircleBtn" class="relative w-48 h-48 md:w-64 md:h-64 rounded-full bg-primary-container flex items-center justify-center glow-pulse group transition-transform hover:scale-105">
          <div class="absolute inset-2 border-4 border-dashed border-background/20 rounded-full animate-[spin_10s_linear_infinite]"></div>
          <div class="z-10 flex flex-col items-center text-background">
            <span class="material-symbols-outlined text-[64px] md:text-[80px] leading-none mb-1">upload_file</span>
            <span class="font-headline-sm tracking-widest text-2xl" id="circleBtnText">SELECT</span>
          </div>
        </button>

        <div class="flex flex-col items-center gap-2">
          <div class="flex items-center gap-3 font-mono-data text-xs text-primary-container">
            <span class="w-2.5 h-2.5 bg-primary-container animate-pulse"></span>
            <span id="heroStatusText">SYSTEM_READY_FOR_INDEXING</span>
          </div>
          <div class="font-mono-data text-[11px] text-on-surface-variant/60 tracking-[0.2em] uppercase text-center max-w-md">
            Direct Zero-Cloud File Streaming // Hardware Encrypted Local LAN Stream
          </div>
        </div>
      </div>
    </section>

    <section class="w-full py-16 px-6 bg-surface-container-low border-t-4 border-primary-container" id="deploymentSection" style="display:none">
      <div class="max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
        
        <!-- Files Manifest Table -->
        <div class="flex flex-col gap-6">
          <div class="border-l-4 border-primary-container pl-4">
            <h2 class="font-headline-md text-on-surface uppercase text-2xl">INDEXED_FILE_MANIFEST</h2>
            <p class="font-mono-data text-on-surface-variant text-sm" id="fileCountText">0 files indexed off laptop disk</p>
          </div>
          
          <div class="border-2 border-outline-variant bg-background p-4 overflow-x-auto max-h-96">
            <table class="w-full font-mono-data text-left border-collapse">
              <thead>
                <tr class="border-b-2 border-outline-variant text-on-surface-variant text-xs">
                  <th class="p-3 font-label-caps">FILENAME</th>
                  <th class="p-3 font-label-caps text-right">SIZE</th>
                </tr>
              </thead>
              <tbody id="fileTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- QR Code Deployment Panel -->
        <div class="flex flex-col gap-6 border-2 border-primary-container bg-surface p-6 md:p-8 relative">
          <div class="absolute -top-4 left-6 bg-primary-container text-background px-3 py-1 font-label-caps text-xs font-bold">HANDSHAKE_QR_TARGET</div>
          
          <div class="border-2 border-primary-container p-4 bg-surface-container-low flex items-center gap-4">
            <span class="material-symbols-outlined text-primary-container text-[32px]">qr_code_scanner</span>
            <div class="font-mono-data text-xs text-on-surface uppercase">
              <strong>Local Wi-Fi / Hotspot:</strong> Connect phone to same Wi-Fi / Mobile Hotspot and scan QR code.
            </div>
          </div>

          <div class="flex flex-col items-center justify-center p-4 bg-background border-2 border-outline-variant">
            <div class="bg-white p-3 border-2 border-on-surface">
              <img id="qrImg" alt="Pairing QR Code" class="w-56 h-56 md:w-64 md:h-64 object-contain">
            </div>
            <div class="font-mono-data text-xs text-primary-container mt-4 p-2 bg-surface-container-high border border-outline-variant w-full text-center break-all" id="ipDisplayText">
              ...
            </div>
          </div>

        </div>

      </div>
    </section>
  `;

  const uploadCircleBtn = document.getElementById("uploadCircleBtn");
  const heroStatusText = document.getElementById("heroStatusText");
  const circleBtnText = document.getElementById("circleBtnText");

  uploadCircleBtn.onclick = async () => {
    uploadCircleBtn.disabled = true;
    circleBtnText.textContent = "INDEXING...";
    heroStatusText.textContent = "INDEXING_FILES_OFF_LAPTOP_DISK...";

    try {
      const res = await fetch("/api/select-files", { method: "POST" });
      if (!res.ok) throw new Error("Native picker error");
      const data = await res.json();
      uploadCircleBtn.disabled = false;
      
      if (data.files && data.files.length) {
        selectedFiles = data.files;
        circleBtnText.textContent = "ADD MORE";
        heroStatusText.textContent = `INDEXED_${selectedFiles.length}_FILES_OFF_DISK`;
        renderFilesManifest();
        await setupNetworkAndQR();
      } else {
        circleBtnText.textContent = "SELECT";
        heroStatusText.textContent = "SYSTEM_READY_FOR_INDEXING";
      }
    } catch (err) {
      browserFileInput.click();
    }
  };

  browserFileInput.onchange = async () => {
    uploadCircleBtn.disabled = false;
    if (!browserFileInput.files.length) return;
    
    selectedFiles = Array.from(browserFileInput.files).map((f, i) => ({
      id: 'f_' + Date.now() + '_' + i,
      name: f.name,
      size: f.size
    }));

    circleBtnText.textContent = "ADD MORE";
    heroStatusText.textContent = `INDEXED_${selectedFiles.length}_FILES_IN_BROWSER`;
    renderFilesManifest();
  };

  function renderFilesManifest() {
    document.getElementById("deploymentSection").style.display = "block";
    document.getElementById("fileCountText").textContent = `${selectedFiles.length} file(s) indexed for direct stream download`;
    
    const tbody = document.getElementById("fileTableBody");
    tbody.innerHTML = selectedFiles.map(f => `
      <tr class="border-b border-outline-variant/40 hover:bg-surface-container">
        <td class="p-3 text-on-surface break-all text-xs">${f.name}</td>
        <td class="p-3 text-primary-container text-right font-bold text-xs">${fmtSize(f.size)}</td>
      </tr>
    `).join("");

    document.getElementById("deploymentSection").scrollIntoView({ behavior: 'smooth' });
  }

  async function setupNetworkAndQR() {
    try {
      const res = await fetch("/api/network-interfaces");
      const data = await res.json();
      wifiIp = data.ip || "127.0.0.1";
      await createLocalSession();
    } catch (err) {
      console.warn("Network interface error:", err);
    }
  }

  async function createLocalSession() {
    const res = await fetch("/api/create-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ip: wifiIp, file_ids: selectedFiles.map(f => f.id) }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    currentSid = data.sid;

    document.getElementById("qrImg").src = `/api/qrcode/${currentSid}?t=${Date.now()}`;
    document.getElementById("ipDisplayText").textContent = `http://${wifiIp}:8080/?sid=${currentSid}`;
  }
}

// ============================== RECEIVER (PHONE) ==============================
function renderReceiver() {
  headerStatusText.textContent = "RECEIVER_NODE";

  app.innerHTML = `
    <section class="w-full py-12 px-6 max-w-[1200px] mx-auto">
      <div class="border-4 border-primary-container bg-surface p-6 md:p-12 flex flex-col gap-8 relative">
        <div class="absolute -top-4 left-6 bg-primary-container text-background px-4 py-1 font-label-caps text-xs font-bold">RECEIVER_PIPE_ACTIVE</div>
        
        <div class="flex flex-col gap-2">
          <h1 class="font-headline-lg text-on-surface uppercase text-3xl md:text-4xl">AVAILABLE_FILE_MANIFEST</h1>
          <p class="font-mono-data text-on-surface-variant text-xs">Tap SAVE to download files directly off laptop disk over Wi-Fi / Hotspot.</p>
        </div>

        <div id="recvFileRows" class="border-2 border-outline-variant bg-background p-4 font-mono-data">
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-primary-container animate-pulse"></span>
            <span class="text-xs text-on-surface">Fetching file manifest...</span>
          </div>
        </div>
      </div>
    </section>
  `;

  let files = [];

  async function loadFiles() {
    try {
      const res = await fetch(`/api/session/${sid}/files`);
      if (!res.ok) throw new Error("Session expired or invalid URL");
      const data = await res.json();
      files = data.files || [];
      renderRecvFiles();
      headerStatusText.textContent = "MANIFEST_LOADED";
    } catch (err) {
      const el = document.getElementById("recvFileRows");
      if (el) {
        el.innerHTML = `
          <div class="p-4 text-error font-bold text-xs">
            ERROR: ${err.message}. Please connect to laptop Wi-Fi / Mobile Hotspot and scan QR code again.
          </div>
        `;
      }
    }
  }

  function renderRecvFiles() {
    const el = document.getElementById("recvFileRows");
    if (!files || !files.length) { el.textContent = "No files in session manifest."; return; }

    el.innerHTML = `
      <div class="flex flex-col gap-3">
        ${files.map(f => `
          <div class="flex items-center justify-between p-4 border border-outline-variant bg-surface hover:border-primary-container">
            <div class="flex flex-col overflow-hidden pr-4">
              <span class="text-on-surface font-bold truncate text-sm">${f.name}</span>
              <span class="text-xs text-on-surface-variant">${fmtSize(f.size)}</span>
            </div>
            <a href="/download/${sid}/${f.id}" download="${f.name}" id="dlBtn-${f.id}" class="bg-primary-container text-background px-4 py-2 font-label-caps flex items-center gap-2 flex-shrink-0 hover:invert text-xs font-bold">
              <span class="material-symbols-outlined text-sm">download</span>
              SAVE
            </a>
          </div>
        `).join('')}
      </div>
    `;
  }

  loadFiles();
}
</script>
</body>
</html>
