<script>
const params = new URLSearchParams(location.search);
const rawSid = params.get("sid") || (location.hash ? new URLSearchParams(location.hash.substring(1)).get("sid") : null);
const sid = rawSid ? rawSid.trim() : null;
const app = document.getElementById("app");
const statusDot = document.getElementById("statusDot");
const headerStatusText = document.getElementById("headerStatusText");
const browserFileInput = document.getElementById("browserFileInput");

const RTC_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' }
  ]
};

function fmtSize(bytes) {
  if (!bytes || isNaN(bytes)) return "0 B";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1024 ** 3) return (bytes / 1024 / 1024).toFixed(1) + " MB";
  return (bytes / 1024 ** 3).toFixed(2) + " GB";
}

function log(tag, ...args) { console.log(`[DUCKTAPE:${tag}]`, ...args); }

sid ? renderReceiver() : renderSender();

// ============================== SENDER (LAPTOP) ==============================
function renderSender() {
  let selectedFiles = [];
  const currentSid = 'dt_' + Math.random().toString(36).substring(2, 9);
  let ws = null;
  let pc = null;
  let dataChannel = null;
  let pendingCandidates = [];
  let manifestInterval = null;
  let peerConnected = false;

  app.innerHTML = `
    <section class="relative w-full min-h-[85vh] flex flex-col items-center justify-center industrial-grid overflow-hidden py-12">
      <div class="relative flex flex-col items-center gap-8">
        <div class="relative bg-on-surface text-background px-4 py-2 font-label-caps animate-bounce text-center text-xs font-bold">
          Click to select files to stream
          <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-full w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-on-surface"></div>
        </div>

        <button id="uploadCircleBtn" class="relative w-48 h-48 md:w-64 md:h-64 rounded-full bg-primary-container flex items-center justify-center glow-pulse group transition-transform hover:scale-105">
          <div class="absolute inset-2 border-4 border-dashed border-background/20 rounded-full animate-[spin_10s_linear_infinite]"></div>
          <div class="z-10 flex flex-col items-center text-background">
            <span class="material-symbols-outlined text-[64px] md:text-[80px] leading-none mb-1">upload_file</span>
            <span class="font-headline-sm tracking-widest text-2xl" id="circleBtnText">SELECT</span>
          </div>
        </button>

        <div class="flex flex-col items-center gap-2">
          <div class="flex items-center gap-3 font-mono-data text-xs text-primary-container">
            <span class="w-2.5 h-2.5 bg-primary-container animate-pulse"></span>
            <span id="heroStatusText">SYSTEM_READY_FOR_FILES</span>
          </div>
          <div class="font-mono-data text-[11px] text-on-surface-variant/60 tracking-[0.2em] uppercase text-center max-w-md">
            Direct Zero-Cloud Local Stream // Hardware Encrypted Pipe
          </div>
        </div>
      </div>
    </section>

    <section class="w-full py-16 px-6 bg-surface-container-low border-t-4 border-primary-container" id="deploymentSection" style="display:none">
      <div class="max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
        <div class="flex flex-col gap-6">
          <div class="border-l-4 border-primary-container pl-4">
            <h2 class="font-headline-md text-on-surface uppercase text-2xl">INDEXED_FILE_MANIFEST</h2>
            <p class="font-mono-data text-on-surface-variant text-sm" id="fileCountText">0 files indexed in browser</p>
          </div>
          <div class="border-2 border-outline-variant bg-background p-4 overflow-x-auto max-h-96">
            <table class="w-full font-mono-data text-left border-collapse">
              <thead>
                <tr class="border-b-2 border-outline-variant text-on-surface-variant text-xs">
                  <th class="p-3 font-label-caps">FILENAME</th>
                  <th class="p-3 font-label-caps text-right">SIZE</th>
                </tr>
              </thead>
              <tbody id="fileTableBody"></tbody>
            </table>
          </div>
        </div>
        <div class="flex flex-col gap-6 border-2 border-primary-container bg-surface p-6 md:p-8 relative">
          <div class="absolute -top-4 left-6 bg-primary-container text-background px-3 py-1 font-label-caps text-xs font-bold">HANDSHAKE_QR_TARGET</div>
          <div class="border-2 border-primary-container p-4 bg-surface-container-low flex items-center gap-4">
            <span class="material-symbols-outlined text-primary-container text-[32px]">qr_code_scanner</span>
            <div class="font-mono-data text-xs text-on-surface uppercase">
              <strong>Local Direct Stream:</strong> Scan QR code using phone camera to establish stream pipe.
            </div>
          </div>
          <div class="flex flex-col items-center justify-center p-4 bg-background border-2 border-outline-variant">
            <div class="bg-white p-3 border-2 border-on-surface">
              <img id="qrImg" alt="Pairing QR Code" class="w-56 h-56 md:w-64 md:h-64 object-contain">
            </div>
            <div class="font-mono-data text-xs text-primary-container mt-4 p-2 bg-surface-container-high border border-outline-variant w-full text-center break-all" id="ipDisplayText">...</div>
          </div>
          <div class="font-mono-data text-xs text-on-surface-variant text-center uppercase" id="pairStatusText">STATUS: Waiting for phone camera scan…</div>
        </div>
      </div>
    </section>
  `;

  const uploadCircleBtn = document.getElementById("uploadCircleBtn");
  const heroStatusText = document.getElementById("heroStatusText");
  const circleBtnText = document.getElementById("circleBtnText");

  uploadCircleBtn.onclick = () => browserFileInput.click();

  browserFileInput.onchange = () => {
    if (!browserFileInput.files.length) return;
    selectedFiles = Array.from(browserFileInput.files).map((f, i) => ({
      id: 'f' + i,
      name: f.name,
      size: f.size,
      rawFile: f
    }));
    log("SENDER", "Selected", selectedFiles.length, "files");
    circleBtnText.textContent = "ADD MORE";
    heroStatusText.textContent = `INDEXED_${selectedFiles.length}_FILES`;
    headerStatusText.textContent = "FILES_INDEXED";
    renderFilesManifest();
    connectSenderWS();
  };

  function getManifestPayload() {
    return JSON.stringify({
      type: "manifest",
      files: selectedFiles.map(f => ({ id: f.id, name: f.name, size: f.size }))
    });
  }

  function broadcastManifest() {
    if (selectedFiles.length === 0) return;
    const payload = getManifestPayload();
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(payload); log("SENDER", "Broadcast manifest via WS"); } catch(e){}
    }
    if (dataChannel && dataChannel.readyState === "open") {
      try { dataChannel.send(payload); log("SENDER", "Broadcast manifest via DC"); } catch(e){}
    }
  }

  function startManifestBroadcast() {
    if (manifestInterval) clearInterval(manifestInterval);
    manifestInterval = setInterval(() => {
      if (!peerConnected) broadcastManifest();
    }, 2000);
    broadcastManifest();
  }

  function renderFilesManifest() {
    document.getElementById("deploymentSection").style.display = "block";
    document.getElementById("fileCountText").textContent = `${selectedFiles.length} file(s) indexed`;
    document.getElementById("fileTableBody").innerHTML = selectedFiles.map(f => `
      <tr class="border-b border-outline-variant/40 hover:bg-surface-container">
        <td class="p-3 text-on-surface break-all text-xs">${f.name}</td>
        <td class="p-3 text-primary-container text-right font-bold text-xs">${fmtSize(f.size)}</td>
      </tr>
    `).join("");
    const targetUrl = `${location.protocol}//${location.host}/?sid=${currentSid}`;
    document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(targetUrl)}`;
    document.getElementById("ipDisplayText").textContent = targetUrl;
    document.getElementById("deploymentSection").scrollIntoView({ behavior: 'smooth' });
  }

  function connectSenderWS() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      startManifestBroadcast();
      return;
    }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/${currentSid}/sender`);

    ws.onopen = () => {
      log("SENDER", "WebSocket connected");
      document.getElementById("pairStatusText").textContent = "STATUS: SIGNAL HUB ONLINE // WAITING FOR PHONE SCAN...";
      startManifestBroadcast();
    };

    ws.onclose = () => {
      log("SENDER", "WebSocket closed, reconnecting in 3s...");
      setTimeout(connectSenderWS, 3000);
    };

    ws.onmessage = (evt) => {
      if (typeof evt.data !== "string") return;
      let msg;
      try { msg = JSON.parse(evt.data); } catch(e) { return; }
      log("SENDER", "Got message:", msg.type);

      if (msg.type === "peer_joined") {
        document.getElementById("pairStatusText").textContent = "STATUS: PHONE DETECTED // CONNECTING DIRECT P2P...";
        broadcastManifest();
        initWebRTC();
      } else if (msg.type === "get_manifest") {
        broadcastManifest();
      } else if (msg.type === "manifest_ack") {
        peerConnected = true;
        if (manifestInterval) { clearInterval(manifestInterval); manifestInterval = null; }
        log("SENDER", "Peer acknowledged manifest");
      } else if (msg.type === "request_file") {
        streamFile(msg.id);
      } else if (msg.type === "answer" && pc) {
        pc.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
          log("SENDER", "Set remote description (answer)");
          while (pendingCandidates.length > 0) {
            pc.addIceCandidate(new RTCIceCandidate(pendingCandidates.shift())).catch(() => {});
          }
        }).catch(e => log("SENDER", "setRemoteDescription error:", e));
      } else if (msg.type === "candidate" && msg.candidate) {
        if (pc && pc.remoteDescription) {
          pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
        } else {
          pendingCandidates.push(msg.candidate);
        }
      }
    };
  }

  function initWebRTC() {
    if (pc) { try { pc.close(); } catch(e){} }
    pendingCandidates = [];

    pc = new RTCPeerConnection(RTC_CONFIG);
    dataChannel = pc.createDataChannel("dt", { ordered: true });

    dataChannel.onopen = () => {
      log("SENDER", "DataChannel OPEN — direct local P2P active");
      headerStatusText.textContent = "P2P_DIRECT_CONNECTED";
      document.getElementById("pairStatusText").textContent = "STATUS: DIRECT LOCAL P2P PIPE ACTIVE";
      document.getElementById("pairStatusText").className = "font-mono-data text-xs text-primary-container text-center font-bold uppercase animate-pulse";
      broadcastManifest();
    };

    dataChannel.onmessage = (evt) => {
      if (typeof evt.data !== "string") return;
      let msg;
      try { msg = JSON.parse(evt.data); } catch(e) { return; }
      if (msg.type === "get_manifest") broadcastManifest();
      else if (msg.type === "manifest_ack") {
        peerConnected = true;
        if (manifestInterval) { clearInterval(manifestInterval); manifestInterval = null; }
      }
      else if (msg.type === "request_file") streamFile(msg.id);
    };

    pc.onicecandidate = (evt) => {
      if (evt.candidate && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "candidate", candidate: evt.candidate }));
      }
    };

    pc.createOffer().then(offer => {
      return pc.setLocalDescription(offer);
    }).then(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription }));
        log("SENDER", "Sent WebRTC offer");
      }
    }).catch(e => log("SENDER", "WebRTC offer error:", e));
  }

  function streamFile(fileId) {
    const fileItem = selectedFiles.find(f => f.id === fileId);
    if (!fileItem || !fileItem.rawFile) { log("SENDER", "File not found:", fileId); return; }

    const file = fileItem.rawFile;
    const useDC = dataChannel && dataChannel.readyState === "open";
    const channel = useDC ? dataChannel : ws;
    const chunkSize = useDC ? 128 * 1024 : 16 * 1024;
    const maxBuffer = useDC ? 8 * 1024 * 1024 : 1024 * 1024;
    let offset = 0;

    log("SENDER", "Streaming", file.name, "via", useDC ? "DataChannel" : "WebSocket", "chunks:", chunkSize);

    const startMsg = JSON.stringify({ type: 'start_transfer', id: fileId, name: file.name, size: file.size });
    try {
      if (useDC) dataChannel.send(startMsg);
      else ws.send(startMsg);
    } catch(e) { return; }

    function pump() {
      if (useDC && (!dataChannel || dataChannel.readyState !== "open")) return;
      if (!useDC && (!ws || ws.readyState !== WebSocket.OPEN)) return;

      const currentChannel = useDC ? dataChannel : ws;
      if (currentChannel.bufferedAmount > maxBuffer) {
        setTimeout(pump, 10);
        return;
      }

      const slice = file.slice(offset, offset + chunkSize);
      const reader = new FileReader();
      reader.onload = (e) => {
        try { currentChannel.send(e.target.result); } catch(err) { return; }
        offset += e.target.result.byteLength;
        if (offset < file.size) {
          if (useDC) setTimeout(pump, 0);
          else setTimeout(pump, 5);
        } else {
          const endMsg = JSON.stringify({ type: 'end_transfer', id: fileId });
          try { currentChannel.send(endMsg); } catch(err){}
          log("SENDER", "Finished streaming", file.name);
        }
      };
      reader.readAsArrayBuffer(slice);
    }
    pump();
  }
}

// ============================== RECEIVER (PHONE) ==============================
function renderReceiver() {
  headerStatusText.textContent = "RECEIVER_NODE";

  app.innerHTML = `
    <section class="w-full py-12 px-6 max-w-[1200px] mx-auto">
      <div class="border-4 border-primary-container bg-surface p-6 md:p-12 flex flex-col gap-8 relative">
        <div class="absolute -top-4 left-6 bg-primary-container text-background px-4 py-1 font-label-caps text-xs font-bold">RECEIVER_PIPE_ACTIVE</div>
        <div class="flex flex-col gap-2">
          <h1 class="font-headline-lg text-on-surface uppercase text-3xl md:text-4xl">AVAILABLE_FILE_MANIFEST</h1>
          <p class="font-mono-data text-on-surface-variant text-xs">Tap SAVE to stream files directly into device downloads.</p>
        </div>
        <div id="recvStatus" class="border-2 border-outline-variant bg-background p-4 font-mono-data">
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-primary-container animate-pulse"></span>
            <span class="text-xs text-on-surface">Connecting to laptop sender node...</span>
          </div>
        </div>
        <div id="recvFileRows" style="display:none"></div>
      </div>
    </section>
  `;

  let files = [];
  let gotManifest = false;
  let ws = null;
  let pc = null;
  let dataChannel = null;
  let fileBuffers = {};
  let pendingCandidates = [];
  let activeFileId = null;
  let manifestRetryInterval = null;

  function setStatus(msg, isError) {
    const el = document.getElementById("recvStatus");
    if (!el) return;
    el.innerHTML = `
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full ${isError ? 'bg-error' : 'bg-primary-container animate-pulse'}"></span>
        <span class="${isError ? 'text-error font-bold' : 'text-on-surface'} font-mono-data text-xs">${msg}</span>
      </div>
    `;
  }

  function sendAck() {
    const ackMsg = JSON.stringify({ type: "manifest_ack" });
    if (dataChannel && dataChannel.readyState === "open") {
      try { dataChannel.send(ackMsg); } catch(e){}
    }
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(ackMsg); } catch(e){}
    }
  }

  function requestManifest() {
    const reqMsg = JSON.stringify({ type: "get_manifest" });
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(reqMsg); } catch(e){}
    }
    if (dataChannel && dataChannel.readyState === "open") {
      try { dataChannel.send(reqMsg); } catch(e){}
    }
  }

  function onManifestReceived(fileList) {
    if (!fileList || !fileList.length) return;
    log("RECV", "Got manifest with", fileList.length, "files");
    gotManifest = true;
    files = fileList;
    if (manifestRetryInterval) { clearInterval(manifestRetryInterval); manifestRetryInterval = null; }
    sendAck();
    document.getElementById("recvStatus").style.display = "none";
    renderFileList();
  }

  function handleMessage(msg) {
    if (msg.type === "manifest") {
      onManifestReceived(msg.files);
    } else if (msg.type === "start_transfer") {
      activeFileId = msg.id;
      const sz = Number(msg.size) || 0;
      fileBuffers[msg.id] = { name: msg.name || msg.id, size: sz, chunks: [], received: 0, done: false };
      const btn = document.getElementById(`dlBtn-${msg.id}`);
      if (btn) { btn.disabled = true; btn.textContent = sz > 0 ? "STREAMING 0%..." : "STREAMING..."; }
      log("RECV", "Start transfer:", msg.name, fmtSize(sz));
    } else if (msg.type === "end_transfer") {
      const fId = msg.id || activeFileId;
      const buf = fileBuffers[fId];
      if (buf && buf.chunks.length > 0 && !buf.done) {
        buf.done = true;
        const blob = new Blob(buf.chunks);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = buf.name || "download";
        document.body.appendChild(a);
        a.click();
        a.remove();
        const btn = document.getElementById(`dlBtn-${fId}`);
        if (btn) { btn.textContent = "DONE ✓"; btn.disabled = false; btn.classList.add("bg-green-600"); }
        log("RECV", "Transfer complete:", buf.name, fmtSize(buf.received));
      }
    }
  }

  function handleBinary(data) {
    if (!activeFileId || !fileBuffers[activeFileId]) return;
    const buf = fileBuffers[activeFileId];
    buf.chunks.push(data);
    buf.received += data.byteLength;
    const btn = document.getElementById(`dlBtn-${activeFileId}`);
    if (btn) {
      const sz = Number(buf.size) || 0;
      if (sz > 0) {
        const pct = Math.min(100, Math.round((buf.received / sz) * 100));
        btn.textContent = `STREAMING ${pct}%...`;
      } else {
        btn.textContent = `STREAMING ${fmtSize(buf.received)}...`;
      }
    }
  }

  function connectReceiverWS() {
    setStatus("CONNECTING TO SIGNAL HUB...");

    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/${sid}/receiver`);

    ws.onopen = () => {
      log("RECV", "WebSocket connected");
      headerStatusText.textContent = "SIGNAL_HUB_CONNECTED";
      setStatus("CONNECTED. REQUESTING FILE MANIFEST...");
      requestManifest();
      // Retry every 2 seconds until we get the manifest
      if (manifestRetryInterval) clearInterval(manifestRetryInterval);
      manifestRetryInterval = setInterval(() => {
        if (!gotManifest) {
          log("RECV", "Retrying manifest request...");
          setStatus("REQUESTING FILE MANIFEST... (retrying)");
          requestManifest();
        } else {
          clearInterval(manifestRetryInterval);
          manifestRetryInterval = null;
        }
      }, 2000);
    };

    ws.onclose = () => {
      log("RECV", "WebSocket closed");
      if (!gotManifest) {
        setStatus("CONNECTION LOST. RECONNECTING...", true);
        setTimeout(connectReceiverWS, 3000);
      }
    };

    ws.onmessage = (evt) => {
      if (typeof evt.data === "string") {
        let msg;
        try { msg = JSON.parse(evt.data); } catch(e) { return; }
        log("RECV", "WS msg:", msg.type);

        if (msg.type === "peer_joined") {
          requestManifest();
        } else if (msg.type === "offer") {
          // Handle WebRTC offer separately to avoid blocking message processing
          setupWebRTC(msg.sdp);
        } else if (msg.type === "candidate" && msg.candidate) {
          if (pc && pc.remoteDescription) {
            pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
          } else {
            pendingCandidates.push(msg.candidate);
          }
        } else {
          handleMessage(msg);
        }
      } else {
        handleBinary(evt.data);
      }
    };
  }

  function setupWebRTC(offerSdp) {
    if (pc) { try { pc.close(); } catch(e){} }
    pendingCandidates = [];

    pc = new RTCPeerConnection(RTC_CONFIG);

    pc.ondatachannel = (evt) => {
      dataChannel = evt.channel;
      dataChannel.onopen = () => {
        log("RECV", "DataChannel OPEN — direct local P2P active");
        headerStatusText.textContent = "P2P_DIRECT_CONNECTED";
        requestManifest();
      };
      dataChannel.onmessage = (evt) => {
        if (typeof evt.data === "string") {
          let msg;
          try { msg = JSON.parse(evt.data); } catch(e) { return; }
          handleMessage(msg);
        } else {
          handleBinary(evt.data);
        }
      };
    };

    pc.onicecandidate = (evt) => {
      if (evt.candidate && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "candidate", candidate: evt.candidate }));
      }
    };

    // Use .then() chains to avoid blocking ws.onmessage
    pc.setRemoteDescription(new RTCSessionDescription(offerSdp)).then(() => {
      log("RECV", "Set remote description (offer)");
      while (pendingCandidates.length > 0) {
        pc.addIceCandidate(new RTCIceCandidate(pendingCandidates.shift())).catch(() => {});
      }
      return pc.createAnswer();
    }).then(answer => {
      return pc.setLocalDescription(answer);
    }).then(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription }));
        log("RECV", "Sent WebRTC answer");
      }
    }).catch(e => log("RECV", "WebRTC setup error:", e));
  }

  function renderFileList() {
    const el = document.getElementById("recvFileRows");
    if (!el || !files.length) return;
    el.style.display = "block";

    el.innerHTML = `
      <div class="flex flex-col gap-3">
        ${files.map(f => `
          <div class="flex items-center justify-between p-4 border border-outline-variant bg-surface hover:border-primary-container">
            <div class="flex flex-col overflow-hidden pr-4">
              <span class="text-on-surface font-bold truncate text-sm">${f.name}</span>
              <span class="text-xs text-on-surface-variant">${fmtSize(f.size)}</span>
            </div>
            <button id="dlBtn-${f.id}" class="bg-primary-container text-background px-4 py-2 font-label-caps flex items-center gap-2 flex-shrink-0 hover:invert text-xs font-bold">
              <span class="material-symbols-outlined text-sm">download</span>
              SAVE
            </button>
          </div>
        `).join('')}
      </div>
    `;

    files.forEach(f => {
      const btn = document.getElementById(`dlBtn-${f.id}`);
      if (!btn) return;
      btn.onclick = () => {
        btn.disabled = true;
        btn.textContent = "REQUESTING...";
        fileBuffers[f.id] = { name: f.name, size: Number(f.size) || 0, chunks: [], received: 0, done: false };

        const reqMsg = JSON.stringify({ type: 'request_file', id: f.id });
        let sent = false;

        // Prefer DataChannel (local, fast), fall back to WebSocket
        if (dataChannel && dataChannel.readyState === "open") {
          try { dataChannel.send(reqMsg); sent = true; log("RECV", "Requested file via DC:", f.name); } catch(e){}
        }
        if (!sent && ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(reqMsg); sent = true; log("RECV", "Requested file via WS:", f.name); } catch(e){}
        }
        if (!sent) {
          btn.disabled = false;
          btn.textContent = "RETRY SAVE";
        }
      };
    });
  }

  connectReceiverWS();
}
</script>
</body>
</html>
