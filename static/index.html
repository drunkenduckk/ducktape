const Relay = {
  async publish(topic, data) {
    try {
      await fetch(`https://ntfy.sh/${topic}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: typeof data === 'string' ? data : JSON.stringify(data)
      });
    } catch (e) {
      console.warn("Relay publish err:", e);
    }
  },

  async poll(topic, timeoutMs = 4000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1`, { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) return null;
      const text = await res.text();
      const lines = text.trim().split('\n');
      for (let i = lines.length - 1; i >= 0; i--) {
        if (!lines[i]) continue;
        try {
          const parsed = JSON.parse(lines[i]);
          if (parsed.message) {
            try { return JSON.parse(parsed.message); } catch(e) { return parsed.message; }
          }
        } catch (e) {}
      }
      return null;
    } catch (e) {
      clearTimeout(timer);
      return null;
    }
  },

  listen(topic, callback) {
    try {
      const es = new EventSource(`https://ntfy.sh/${topic}/sse`);
      es.onmessage = (evt) => {
        try {
          const parsed = JSON.parse(evt.data);
          if (parsed.message) {
            try {
              callback(JSON.parse(parsed.message));
            } catch (e) {
              callback(parsed.message);
            }
          }
        } catch (e) {}
      };
      return es;
    } catch(e) {
      return null;
    }
  }
};

function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const len = bytes.byteLength;
  for (let i = 0; i < len; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binaryString = atob(base64);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  return bytes.buffer;
}

          <span class="material-symbols-outlined text-error text-[48px]">warning</span>
        </div>
        <div class="flex-grow">
          <h4 class="font-headline-sm text-error uppercase mb-2">SAME NETWORK RECOMMENDED</h4>
          <p class="font-mono-data text-on-surface text-body-md uppercase">
            WEBRTC PEER-TO-PEER ENCRYPTION. DIRECT MEMORY STREAMING BETWEEN DEVICES.
          </p>
        </div>
        <div class="font-mono-data text-[10px] text-error opacity-50 text-right uppercase hidden lg:block">
          PROTOCOL_V2.04<br/>SECURE_BY_PROXIMITY<br/>ENCRYPTED_HANDSHAKE
        </div>
      </div>
    </section>
  `;

  const uploadCircleBtn = document.getElementById("uploadCircleBtn");
  const heroStatusText = document.getElementById("heroStatusText");
  const circleBtnText = document.getElementById("circleBtnText");

  uploadCircleBtn.onclick = async () => {
    uploadCircleBtn.disabled = true;
    heroStatusText.textContent = "WAITING_FOR_FILE_SELECTION...";

    try {
      const res = await fetch("/api/select-files", { method: "POST" });
      if (!res.ok) throw new Error("Static Host");
      const data = await res.json();
      uploadCircleBtn.disabled = false;
      
      if (data.files && data.files.length) {
        selectedFiles = data.files;
        circleBtnText.textContent = "ADD MORE";
        heroStatusText.textContent = `INDEXED_${selectedFiles.length}_FILES_OFF_DISK`;
        renderFilesManifest();
        await setupNetworkAndQR();
      }
    } catch (err) {
      isStaticHost = true;
      browserFileInput.click();
    }
  };

  browserFileInput.onchange = async () => {
    uploadCircleBtn.disabled = false;
    if (!browserFileInput.files.length) return;
    
    selectedFiles = Array.from(browserFileInput.files).map((f, i) => ({
      id: 'f_' + Date.now() + '_' + i,
      name: f.name,
      size: f.size,
      rawFile: f
    }));

    circleBtnText.textContent = "ADD MORE";
    heroStatusText.textContent = `INDEXED_${selectedFiles.length}_FILES_IN_BROWSER`;
    renderFilesManifest();
    await setupNetworkAndQR();
  };

  function renderFilesManifest() {
    document.getElementById("deploymentSection").style.display = "block";
    document.getElementById("fileCountText").textContent = `${selectedFiles.length} file(s) indexed for streaming`;
    
    const tbody = document.getElementById("fileTableBody");
    tbody.innerHTML = selectedFiles.map(f => `
      <tr class="border-b border-outline-variant/40 hover:bg-surface-container">
        <td class="p-3 text-on-surface break-all">${f.name}</td>
        <td class="p-3 text-primary-container text-right font-bold">${fmtSize(f.size)}</td>
      </tr>
    `).join("");

    document.getElementById("deploymentSection").scrollIntoView({ behavior: 'smooth' });
  }

  async function setupNetworkAndQR() {
    if (!isStaticHost) {
      try {
        const res = await fetch("/api/network-interfaces");
        const contentType = res.headers.get("content-type") || "";
        if (!res.ok || contentType.includes("text/html")) throw new Error("P2P Mode (Static Host)");
        const data = await res.json();
        wifiIp = data.ip || "127.0.0.1";
        await createLocalSession();
        return;
      } catch (err) {
        isStaticHost = true;
      }
    }
    setupP2PPeer();
  }

  async function createLocalSession() {
    const res = await fetch("/api/create-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ip: wifiIp, file_ids: selectedFiles.map(f => f.id) }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    currentSid = data.sid;

    document.getElementById("qrImg").src = `/api/qrcode/${currentSid}?t=${Date.now()}`;
    document.getElementById("ipDisplayText").textContent = `http://${wifiIp}:8080/?sid=${currentSid}`;
    connectSenderWS(currentSid);
  }

  function setupP2PPeer() {
    currentSid = 'dt_' + Math.random().toString(36).substring(2, 9);
    const targetUrl = `${location.protocol}//${location.host}/?sid=${currentSid}`;

    document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(targetUrl)}`;
    document.getElementById("ipDisplayText").textContent = targetUrl;
    document.getElementById("pairStatusText").textContent = "STATUS: PUBLISHING MANIFEST TO RELAY...";

    const manifestData = selectedFiles.map(f => ({ id: f.id, name: f.name, size: f.size }));
    Relay.publish(`dt_m_${currentSid}`, manifestData);

    // Listen for file and manifest requests coming over Relay
    Relay.listen(`dt_req_${currentSid}`, (msg) => {
      if (msg && msg.type === 'get_manifest') {
        const manifestData = selectedFiles.map(f => ({ id: f.id, name: f.name, size: f.size }));
        Relay.publish(`dt_m_${currentSid}`, manifestData);
      } else if (msg && msg.type === 'request_file') {
        streamFileToPeer(msg.id, activeConn);
      }
    });

    if (typeof Peer !== 'undefined') {
      try {
        if (p2pPeer) p2pPeer.destroy();
      } catch (e) {}

      p2pPeer = new Peer(currentSid, PEER_CONFIG);
      
      p2pPeer.on('open', () => {
        headerStatusText.textContent = "P2P_SIGNAL_READY";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-primary-container animate-ping";
        document.getElementById("pairStatusText").textContent = "STATUS: WAITING FOR PHONE TO SCAN QR CODE...";
      });

      p2pPeer.on('disconnected', () => {
        document.getElementById("pairStatusText").textContent = "STATUS: SIGNAL DISCONNECTED. RECONNECTING...";
        try { p2pPeer.reconnect(); } catch (e) {}
      });

      p2pPeer.on('error', (err) => {
        console.warn("Sender PeerJS error:", err);
        document.getElementById("pairStatusText").textContent = `STATUS: P2P SIGNAL ERROR (${err.type || 'error'}). RETRYING...`;
      });

      p2pPeer.on('connection', (conn) => {
        activeConn = conn;
        headerStatusText.textContent = "PEER_CONNECTED";
        document.getElementById("pairStatusText").textContent = "STATUS: PEER_CONNECTED // READY FOR P2P STREAM";
        document.getElementById("pairStatusText").className = "font-mono-data text-xs text-primary-container text-center font-bold uppercase animate-pulse";
        document.getElementById("startBtn").style.display = "flex";

        const sendManifest = () => {
          if (selectedFiles && selectedFiles.length > 0) {
            try {
              conn.send({
                type: 'manifest',
                files: selectedFiles.map(f => ({ id: f.id, name: f.name, size: f.size }))
              });
            } catch (e) {}
          }
        };

        if (conn.open) {
          sendManifest();
        } else {
          conn.on('open', sendManifest);
        }

        conn.on('data', (msg) => {
          if (msg && msg.type === 'get_manifest') {
            sendManifest();
          } else if (msg && msg.type === 'request_file') {
            streamFileToPeer(msg.id, conn);
          }
        });
      });
    }
  }

  function streamFileToPeer(fileId, conn) {
    const fileItem = selectedFiles.find(f => f.id === fileId);
    if (!fileItem || !fileItem.rawFile) return;

    const file = fileItem.rawFile;
    const isWebRTC = conn && conn.open;
    const chunkSize = isWebRTC ? 32 * 1024 : 2048;
    let offset = 0;

    const startMsg = { type: 'start_transfer', id: fileId, name: file.name, size: file.size };
    if (isWebRTC) {
      try { conn.send(startMsg); } catch(e){}
    }
    Relay.publish(`dt_c_${currentSid}_${fileId}`, startMsg);

    function readSlice() {
      if (conn && conn.open) {
        const dc = conn.dataChannel || conn._dc || (conn.peerConnection && conn.peerConnection.dataChannel);
        if (dc && dc.bufferedAmount > 1024 * 1024) {
          setTimeout(readSlice, 30);
          return;
        }
      }

      const slice = file.slice(offset, offset + chunkSize);
      const reader = new FileReader();
      reader.onload = (e) => {
        const arrayBuffer = e.target.result;

        if (conn && conn.open) {
          try { conn.send({ type: 'file_chunk', id: fileId, data: arrayBuffer }); } catch(e){}
        } else {
          const base64Data = arrayBufferToBase64(arrayBuffer);
          Relay.publish(`dt_c_${currentSid}_${fileId}`, {
            type: 'file_chunk',
            id: fileId,
            offset: offset,
            data: base64Data
          });
        }

        offset += arrayBuffer.byteLength;
        if (offset < file.size) {
          setTimeout(readSlice, conn && conn.open ? 5 : 40);
        } else {
          const endMsg = { type: 'end_transfer', id: fileId };
          if (conn && conn.open) try { conn.send(endMsg); } catch(e){}
          Relay.publish(`dt_c_${currentSid}_${fileId}`, endMsg);
        }
      };
      reader.onerror = (err) => {
        console.error("FileReader error:", err);
      };
      reader.readAsArrayBuffer(slice);
    }
    readSlice();
  }

  function connectSenderWS(theSid) {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/sender/${theSid}`);

    ws.onopen = () => {
      headerStatusText.textContent = "HANDSHAKE_READY";
      statusDot.className = "w-2.5 h-2.5 rounded-full bg-primary-container animate-ping";
    };

    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.event === "phone_connected") {
        document.getElementById("pairStatusText").textContent = "STATUS: PEER_CONNECTED // READY FOR STREAMING";
        document.getElementById("pairStatusText").className = "font-mono-data text-xs text-primary-container text-center font-bold uppercase animate-pulse";
        document.getElementById("startBtn").style.display = "flex";
        headerStatusText.textContent = "PEER_PAIRED";
      }
    };
  }

  document.getElementById("startBtn").onclick = async () => {
    selectedFiles.forEach(f => streamFileToPeer(f.id, activeConn));
    Relay.publish(`dt_cmd_${currentSid}`, { type: 'start_all' });
    document.getElementById("startBtn").textContent = "SIGNAL_DISPATCHED_TO_PEER";
    document.getElementById("startBtn").disabled = true;
  };
}

// ============================== RECEIVER (PHONE) ==============================
function renderReceiver() {
  headerStatusText.textContent = "RECEIVER_NODE";

  app.innerHTML = `
    <section class="w-full py-12 px-margin max-w-container-max mx-auto">
      <div class="border-4 border-primary-container bg-surface p-6 md:p-12 flex flex-col gap-8 relative">
        <div class="absolute -top-4 left-6 bg-primary-container text-background px-4 py-1 font-label-caps">RECEIVER_PIPE_ACTIVE</div>
        
        <div class="flex flex-col gap-2">
          <h1 class="font-headline-lg text-on-surface uppercase">AVAILABLE_FILE_MANIFEST</h1>
          <p class="font-mono-data text-on-surface-variant">Tap save to stream files directly into your device downloads.</p>
        </div>

        <button id="batchBtn" class="bg-primary-container text-background font-headline-md px-8 py-4 hover:brightness-110 transition-all uppercase flex items-center justify-center gap-3">
          <span class="material-symbols-outlined">download</span>
          DOWNLOAD ALL FILES
        </button>

        <div id="recvFileRows" class="border-2 border-outline-variant bg-background p-4 font-mono-data">
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-primary-container animate-pulse"></span>
            <span>Initializing connection to sender...</span>
          </div>
        </div>
      </div>
    </section>
  `;

  let files = [];
  let p2pConn = null;
  let fileBuffers = {};
  let p2pRetryTimer = null;
  let p2pAttempts = 0;

  function updateRecvStatus(message, isError = false, showRetryBtn = false) {
    const el = document.getElementById("recvFileRows");
    if (!el) return;
    el.innerHTML = `
      <div class="flex flex-col gap-3 p-4 border border-outline-variant bg-surface">
        <div class="flex items-center gap-3">
          <span class="w-3 h-3 rounded-full ${isError ? 'bg-error' : 'bg-primary-container animate-pulse'}"></span>
          <span class="${isError ? 'text-error font-bold' : 'text-on-surface'} font-mono-data">${message}</span>
        </div>
        <div class="text-xs text-on-surface-variant border-t border-outline-variant/30 pt-2 font-mono-data">
          ⚡ <b>LOCAL P2P TIP:</b> Ensure laptop tab stays open. If phone has 4G/5G mobile data ON, turn OFF mobile data and use Wi-Fi for instant pairing.
        </div>
        ${showRetryBtn ? `
          <button id="manualRetryBtn" class="mt-2 bg-primary-container text-background px-4 py-2 font-label-caps uppercase self-start hover:brightness-110 flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">refresh</span>
            RETRY P2P CONNECTION
          </button>
        ` : ''}
      </div>
    `;
    if (showRetryBtn) {
      const btn = document.getElementById("manualRetryBtn");
      if (btn) {
        btn.onclick = () => {
          p2pAttempts = 0;
          connectP2PReceiver();
        };
      }
    }
  }

  async function loadFiles() {
    try {
      const res = await fetch(`/api/session/${sid}/files`);
      const contentType = res.headers.get("content-type") || "";
      if (!res.ok || contentType.includes("text/html")) throw new Error("P2P Mode");
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      files = data.files || [];
      renderRecvFiles();
      connectReceiverWS();
    } catch (err) {
      connectP2PReceiver();
    }
  }

  let activeRelayListeners = {};
  let requestTimeouts = {};

  async function connectP2PReceiver() {
    if (!files || !files.length) {
      updateRecvStatus("FETCHING SESSION FILE MANIFEST FROM RELAY...");
    }

    // Listen for remote dispatch signals and manifest updates on Relay
    if (!activeRelayListeners[`cmd_${sid}`]) {
      activeRelayListeners[`cmd_${sid}`] = Relay.listen(`dt_cmd_${sid}`, (msg) => {
        if (msg && msg.type === 'start_all') {
          const batchBtn = document.getElementById("batchBtn");
          if (batchBtn) batchBtn.click();
        }
      });
    }

    if (!activeRelayListeners[`manifest_${sid}`]) {
      activeRelayListeners[`manifest_${sid}`] = Relay.listen(`dt_m_${sid}`, (msg) => {
        if (msg && Array.isArray(msg) && msg.length > 0) {
          if (!files || !files.length) {
            files = msg;
            renderRecvFilesP2P();
          }
        }
      });
    }

    // Request manifest over Relay immediately
    Relay.publish(`dt_req_${sid}`, { type: 'get_manifest' });

    // Fast-path 1: Instant Manifest Fetch via HTTP Relay
    try {
      const relayManifest = await Relay.poll(`dt_m_${sid}`, 3500);
      if (relayManifest && Array.isArray(relayManifest) && relayManifest.length > 0) {
        if (!files || !files.length) {
          files = relayManifest;
          renderRecvFilesP2P();
        }
      }
    } catch(e) {}

    // Fast-path 2: Connect WebRTC via PeerJS
    if (typeof Peer === 'undefined') {
      if (!files || !files.length) {
        updateRecvStatus("ERROR: PeerJS library failed to load. Check internet or adblocker.", true, true);
      }
      return;
    }

    if (p2pConn && p2pConn.open) return;

    if (p2pRetryTimer) {
      clearTimeout(p2pRetryTimer);
      p2pRetryTimer = null;
    }

    p2pAttempts++;
    if (!files || !files.length) {
      updateRecvStatus(`INITIALIZING WEBRTC P2P SIGNAL (ATTEMPT ${p2pAttempts})...`);
    }

    let peer;
    try {
      peer = new Peer(PEER_CONFIG);
    } catch (e) {
      console.warn("Peer creation failed:", e);
      return;
    }
    
    peer.on('open', () => {
      headerStatusText.textContent = "P2P_SIGNAL_READY";
      if (!files || !files.length) {
        updateRecvStatus(`P2P SIGNAL ESTABLISHED. CONNECTING TO SENDER (${sid})...`);
      }
      
      try {
        p2pConn = peer.connect(sid);
      } catch (err) {
        if (!files || !files.length) {
          updateRecvStatus(`CONNECTION FAILED: ${err.message}. RETRYING...`, true, true);
        }
        return;
      }

      let connTimeout = setTimeout(() => {
        if (!p2pConn || !p2pConn.open) {
          if (!files || !files.length) {
            updateRecvStatus(`WEBRTC NEGOTIATION STALLED WITH (${sid}). RETRYING (ATTEMPT ${p2pAttempts+1})...`, true, true);
            try { peer.destroy(); } catch (e) {}
            p2pRetryTimer = setTimeout(connectP2PReceiver, 3000);
          }
        }
      }, 10000);

      const onConnOpen = () => {
        clearTimeout(connTimeout);
        headerStatusText.textContent = "P2P_CONNECTED";
        if (!files || !files.length) {
          updateRecvStatus("CONNECTED TO SENDER NODE. FETCHING FILE MANIFEST...");
        }
        try { p2pConn.send({ type: 'get_manifest' }); } catch(e){}
      };

      const checkPeerConnection = () => {
        const pc = p2pConn.peerConnection || p2pConn._peerConnection;
        if (pc) {
          pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            if (state === "checking") {
              headerStatusText.textContent = "P2P_EXCHANGING_SIGNALS";
              if (!files || !files.length) updateRecvStatus(`EXCHANGING WEBRTC SIGNALS WITH SENDER (${sid})...`);
            } else if (state === "connected" || state === "completed") {
              headerStatusText.textContent = "P2P_CONNECTED";
              if (!files || !files.length) updateRecvStatus("CONNECTED TO SENDER NODE. FETCHING FILE MANIFEST...");
            } else if (state === "failed" || state === "disconnected") {
              clearTimeout(connTimeout);
              if (!files || !files.length) {
                updateRecvStatus(`WEBRTC CONNECTION FAILED. RETRYING...`, true, true);
                try { peer.destroy(); } catch (e) {}
                p2pRetryTimer = setTimeout(connectP2PReceiver, 3000);
              }
            }
          };
        }
      };

      if (p2pConn.open) {
        onConnOpen();
      } else {
        p2pConn.on('open', onConnOpen);
        setTimeout(checkPeerConnection, 100);
      }

      p2pConn.on('data', (msg) => {
        handleFileMessage(msg);
      });

      p2pConn.on('close', () => {
        headerStatusText.textContent = "DISCONNECTED";
      });

      p2pConn.on('error', (err) => {
        console.warn("Data channel error:", err);
      });
    });

    peer.on('error', (err) => {
      console.warn("Receiver PeerJS error:", err);
      if (!files || !files.length) {
        let msg = `P2P ERROR (${err.type || 'unknown'})`;
        if (err.type === 'peer-unavailable') {
          msg = `SENDER NODE NOT READY YET. PLEASE MAKE SURE LAPTOP HAS FILES INDEXED & TAB IS OPEN.`;
        }
        updateRecvStatus(`${msg} — RETRYING IN 3s...`, true, true);
        if (p2pAttempts < 4) {
          p2pRetryTimer = setTimeout(connectP2PReceiver, 3000);
        }
      }
    });
  }

  function handleFileMessage(msg) {
    if (!msg || (!msg.id && msg.type !== 'manifest')) return;

    if (msg.type === 'manifest') {
      if (msg.files && msg.files.length) {
        const isNew = files.length !== msg.files.length || files.some((f, i) => f.id !== msg.files[i]?.id);
        files = msg.files;
        if (isNew) renderRecvFilesP2P();
      }
      return;
    }

    const fId = msg.id;
    if (requestTimeouts[fId]) {
      clearTimeout(requestTimeouts[fId]);
      delete requestTimeouts[fId];
    }

    if (!fileBuffers[fId]) {
      fileBuffers[fId] = { name: msg.name || fId, size: msg.size || 0, chunks: [], bytesReceived: 0, done: false };
    }
    const buf = fileBuffers[fId];

    if (msg.type === 'start_transfer') {
      const btn = document.getElementById(`dlBtn-${fId}`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = "STREAMING 0%...";
      }
    } else if (msg.type === 'file_chunk' && msg.data) {
      let arrayBuf;
      if (typeof msg.data === 'string') {
        arrayBuf = base64ToArrayBuffer(msg.data);
      } else {
        arrayBuf = msg.data;
      }
      buf.chunks.push(arrayBuf);
      buf.bytesReceived += arrayBuf.byteLength;

      const btn = document.getElementById(`dlBtn-${fId}`);
      if (btn) {
        btn.disabled = true;
        if (buf.size > 0) {
          const pct = Math.min(100, Math.round((buf.bytesReceived / buf.size) * 100));
          btn.textContent = `STREAMING ${pct}%...`;
        } else {
          btn.textContent = "STREAMING...";
        }
      }
    } else if (msg.type === 'end_transfer') {
      if (buf.chunks.length > 0 && !buf.done) {
        buf.done = true;
        const blob = new Blob(buf.chunks);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = buf.name || "download";
        document.body.appendChild(a);
        a.click();
        a.remove();
        
        const btn = document.getElementById(`dlBtn-${fId}`);
        if (btn) {
          btn.textContent = "DONE ✓";
          btn.disabled = false;
        }
      }
    }
  }

  function renderRecvFilesP2P() {
    const el = document.getElementById("recvFileRows");
    if (!files || !files.length) { el.textContent = "No files in session manifest."; return; }

    el.innerHTML = `
      <div class="flex flex-col gap-3">
        ${files.map(f => `
          <div class="flex items-center justify-between p-4 border border-outline-variant bg-surface hover:border-primary-container">
            <div class="flex flex-col overflow-hidden pr-4">
              <span class="text-on-surface font-bold truncate">${f.name}</span>
              <span class="text-xs text-on-surface-variant">${fmtSize(f.size)}</span>
            </div>
            <button id="dlBtn-${f.id}" class="bg-primary-container text-background px-4 py-2 font-label-caps flex items-center gap-2 flex-shrink-0 hover:invert">
              <span class="material-symbols-outlined text-sm">download</span>
              SAVE
            </button>
          </div>
        `).join('')}
      </div>
    `;

    files.forEach(f => {
      const btn = document.getElementById(`dlBtn-${f.id}`);
      if (!btn) return;
      btn.onclick = () => {
        btn.disabled = true;
        btn.textContent = "REQUESTING...";

        if (requestTimeouts[f.id]) clearTimeout(requestTimeouts[f.id]);
        requestTimeouts[f.id] = setTimeout(() => {
          const currentBtn = document.getElementById(`dlBtn-${f.id}`);
          if (currentBtn && (currentBtn.textContent === "REQUESTING..." || currentBtn.disabled && !currentBtn.textContent.startsWith("STREAMING") && currentBtn.textContent !== "DONE ✓")) {
            currentBtn.disabled = false;
            currentBtn.textContent = "RETRY SAVE";
          }
        }, 8000);

        if (!activeRelayListeners[`chunk_${f.id}`]) {
          activeRelayListeners[`chunk_${f.id}`] = Relay.listen(`dt_c_${sid}_${f.id}`, (msg) => {
            handleFileMessage(msg);
          });
        }

        Relay.publish(`dt_req_${sid}`, { type: 'request_file', id: f.id });

        if (p2pConn && p2pConn.open) {
          try { p2pConn.send({ type: 'request_file', id: f.id }); } catch(e){}
        }
      };
    });
  }

  function renderRecvFiles() {
    const el = document.getElementById("recvFileRows");
    if (!files.length) { el.textContent = "No files in session manifest."; return; }

    el.innerHTML = `
      <div class="flex flex-col gap-3">
        ${files.map(f => `
          <div class="flex items-center justify-between p-4 border border-outline-variant bg-surface hover:border-primary-container">
            <div class="flex flex-col overflow-hidden pr-4">
              <span class="text-on-surface font-bold truncate">${f.name}</span>
              <span class="text-xs text-on-surface-variant">${fmtSize(f.size)}</span>
            </div>
            <a href="/download/${sid}/${f.id}" download="${f.name}" id="dlBtn-${f.id}" class="bg-primary-container text-background px-4 py-2 font-label-caps flex items-center gap-2 flex-shrink-0 hover:invert">
              <span class="material-symbols-outlined text-sm">download</span>
              SAVE
            </a>
          </div>
        `).join('')}
      </div>
    `;
  }

  document.getElementById("batchBtn").onclick = () => {
    files.forEach((f, i) => {
      setTimeout(() => {
        const btn = document.getElementById(`dlBtn-${f.id}`);
        if (btn) btn.click();
      }, i * 500);
    });
  };

  function connectReceiverWS() {
    try {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws/receiver/${sid}`);

      ws.onopen = () => {
        headerStatusText.textContent = "STREAM_READY";
      };

      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.event === "start_transfer") {
          document.getElementById("batchBtn").click();
        }
      };
    } catch (e) {
      console.log("WS error:", e);
    }
  }

  loadFiles();
}
</script>
</body>
</html>
